# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "80df88204d5a9c755704bddd1efba955"
name = "khyathi sitemap"
application_url = "https://khyathi.adnabu.net/shopify/sitemap"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2025-01"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_content,read_products,read_themes"
optional_scopes = [ ]
use_legacy_install_flow = true

[auth]
redirect_urls = [
  "https://khyathi.adnabu.net/shopify/auth/callback/sitemap",
  "http://khyathi.adnabu.net/shopify/auth/callback/sitemap"
]

[app_proxy]
url = "https://khyathi.adnabu.net/sitemap"
subpath = "sitemap"
prefix = "apps"
